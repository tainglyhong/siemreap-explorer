<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Siem Reap Itinerary Explorer</title>

    <meta name="theme-color" content="#059669" />
    <link
      rel="apple-touch-icon"
      href="https://placehold.co/192x192/059669/ffffff.png?text=SR"
    />
    <link rel="manifest" id="manifest" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Leaflet Routing Machine CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      /* Glassmorphism routing container */
      .leaflet-routing-container {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5) !important;
        border-radius: 1rem !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1) !important;
        padding: 1rem !important;
        color: #1f2937 !important;
        max-height: 40vh;
        overflow-y: auto;
        margin-top: 1rem !important;
        margin-right: 1rem !important;
        transition: all 0.3s ease;
      }
      @media (max-width: 768px) {
        .leaflet-routing-container {
          display: none !important;
        } /* Hide on mobile to save map space */
      }
      /* Custom Zoom Controls */
      .leaflet-control-zoom {
        border: none !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1) !important;
        border-radius: 0.75rem !important;
        overflow: hidden;
      }
      .leaflet-control-zoom a {
        background-color: rgba(255, 255, 255, 0.9) !important;
        backdrop-filter: blur(4px);
        color: #374151 !important;
      }
      .leaflet-control-zoom a:hover {
        background-color: #fff !important;
        color: #059669 !important;
      }

      /* Custom Glass Popups */
      .glass-popup .leaflet-popup-content-wrapper {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 1rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        padding: 0;
      }
      .glass-popup .leaflet-popup-tip {
        background: rgba(255, 255, 255, 0.95);
      }

      /* Hide scrollbar for layout */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom standard scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Mobile-safe full height (fixes browser address-bar jump) */
      html,
      body {
        height: 100dvh !important;
      }
      /* Search input + visited card styling */
      .card-visited {
        opacity: 0.6;
      }
      .card-visited h3 {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-gray-800 w-screen h-screen overflow-hidden font-sans antialiased"
  >
    <!-- App Container (Side-by-side on desktop, stacked on mobile) -->
    <div class="w-full h-full flex relative overflow-hidden">
      <!-- Solid Sidebar / List Panel -->
      <div
        id="sidebar-panel"
        class="w-full md:w-[420px] bg-white flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.1)] h-full transition-transform duration-300 transform translate-x-0 md:translate-x-0 absolute md:relative z-30 flex-shrink-0"
      >
        <!-- Header -->
        <div class="px-6 pt-8 pb-5 border-b border-gray-100 bg-white">
          <h1
            class="text-3xl font-extrabold tracking-tight text-emerald-600 drop-shadow-sm"
          >
            Siem Reap Explorer
          </h1>
          <p
            class="text-sm font-medium text-gray-500 mt-1 flex items-center gap-2"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              ></path>
            </svg>
            2 Days, 1 Night Premium Itinerary
          </p>
        </div>

        <!-- Search -->
        <div class="px-6 pt-4 bg-white flex gap-2">
          <input
            id="search-input"
            type="search"
            placeholder="Search places..."
            oninput="searchPlaces(this.value)"
            class="flex-1 min-w-0 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
          <button
            onclick="openAddPlace()"
            class="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 rounded-xl shadow-md"
          >
            + Add
          </button>
        </div>

        <!-- Category Filters -->
        <div
          class="px-6 py-4 flex gap-3 overflow-x-auto hide-scrollbar shrink-0 bg-white border-b border-gray-100"
        >
          <button
            data-cat="All"
            onclick="filterPlaces('All')"
            class="filter-btn active shrink-0 bg-emerald-600 text-white shadow-md shadow-emerald-600/20 px-4 py-2 rounded-full text-sm font-semibold transition-all hover:scale-105"
          >
            All
          </button>
          <button
            data-cat="Temple"
            onclick="filterPlaces('Temple')"
            class="filter-btn shrink-0 bg-gray-50 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 transition-all hover:scale-105"
          >
            Temples
          </button>
          <button
            data-cat="Cafe"
            onclick="filterPlaces('Cafe')"
            class="filter-btn shrink-0 bg-gray-50 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 transition-all hover:scale-105"
          >
            Cafes
          </button>
          <button
            data-cat="Food & Nightlife"
            onclick="filterPlaces('Food & Nightlife')"
            class="filter-btn shrink-0 bg-gray-50 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 transition-all hover:scale-105"
          >
            Food & Nightlife
          </button>
          <button
            data-cat="Hotel"
            onclick="filterPlaces('Hotel')"
            class="filter-btn shrink-0 bg-gray-50 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 transition-all hover:scale-105"
          >
            Hotels
          </button>
        </div>

        <!-- Places List -->
        <div
          id="places-list"
          class="flex-1 overflow-y-auto px-6 py-4 space-y-4 pb-24 relative z-0 bg-slate-50"
        >
          <!-- Cards populated by JS -->
        </div>

        <!-- Bottom Gradient Fade for List -->
        <div
          class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-slate-50 to-transparent pointer-events-none"
        ></div>
      </div>

      <!-- Map Area -->
      <div class="flex-1 h-full w-full absolute inset-0 md:relative z-20">
        <!-- Fullscreen Map -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- Mobile Back to List Button -->
        <button
          onclick="showList()"
          class="md:hidden absolute top-6 left-4 z-[1000] bg-white/95 backdrop-blur shadow-lg border border-gray-200 text-gray-800 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-gray-50 transition-colors"
        >
          <svg
            class="w-5 h-5 text-emerald-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          Back to List
        </button>

        <!-- Floating Action Buttons -->
        <div
          class="pointer-events-auto absolute top-24 right-4 md:bottom-6 md:right-6 md:top-auto flex flex-col gap-3 z-[1000]"
        >
          <button
            id="clear-route-btn"
            onclick="clearRoute()"
            class="hidden bg-rose-500/90 backdrop-blur-md hover:bg-rose-600 text-white font-semibold py-3 px-5 rounded-2xl shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-2 border border-rose-400/50"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
            Clear Route
          </button>
        </div>
      </div>
    </div>

    <!-- Add / Edit place dialog -->
    <div id="place-modal" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[80] items-end md:items-center justify-center">
      <div class="bg-white w-full md:w-[440px] rounded-t-3xl md:rounded-3xl p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] shadow-2xl max-h-[92dvh] overflow-y-auto">
        <h2 id="place-modal-title" class="text-xl font-extrabold text-gray-900 mb-4">Add a place</h2>
        <label class="text-xs font-bold text-gray-500 uppercase">Name</label>
        <input id="pm-name" class="w-full mt-1 mb-3 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g. Banteay Samre" />
        <label class="text-xs font-bold text-gray-500 uppercase">Category</label>
        <select id="pm-cat" class="w-full mt-1 mb-3 border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white">
          <option value="Temple">Temple</option>
          <option value="Cafe">Cafe</option>
          <option value="Food & Nightlife">Food &amp; Nightlife</option>
          <option value="Hotel">Hotel</option>
        </select>
        <label class="text-xs font-bold text-gray-500 uppercase">Note (optional)</label>
        <textarea id="pm-desc" rows="2" class="w-full mt-1 mb-3 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Why do you want to go?"></textarea>
        <label class="text-xs font-bold text-gray-500 uppercase">Location</label>
        <input id="pm-coords" oninput="onCoordsInput(this.value)" class="w-full mt-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Paste a Google Maps link (short links OK) or 13.4125, 103.8670" />
        <p id="pm-status" class="hidden text-xs mt-1.5 font-medium"></p>
        <div class="flex gap-2 mt-2 mb-4">
          <button onclick="startPickLocation()" class="flex-1 border border-emerald-600 text-emerald-700 text-sm font-semibold py-2 rounded-xl">📍 Pick on map</button>
          <button onclick="useMyLocation()" class="flex-1 border border-gray-300 text-gray-700 text-sm font-semibold py-2 rounded-xl">🎯 My location</button>
        </div>
        <div class="flex gap-2">
          <button onclick="closePlaceModal()" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl">Cancel</button>
          <button onclick="savePlace()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl">Save</button>
        </div>
      </div>
    </div>

    <!-- Pick-on-map banner -->
    <div id="pick-banner" class="hidden fixed top-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white rounded-2xl shadow-2xl px-5 py-3 z-[950] flex items-center gap-4">
      <span class="text-sm font-medium">Tap the map to set the location</span>
      <button onclick="cancelPick()" class="text-sm font-bold text-rose-300">Cancel</button>
    </div>

    <!-- Turn-by-turn banner (shown while navigating) -->
    <div
      id="nav-banner"
      class="hidden fixed top-20 md:top-4 left-1/2 md:left-[calc(50%+210px)] -translate-x-1/2 w-[92%] max-w-md bg-emerald-700 text-white rounded-2xl shadow-2xl px-4 py-3 z-[950] flex items-center gap-3"
    >
      <span id="nav-arrow" class="text-3xl w-10 text-center"></span>
      <div class="flex-1 min-w-0">
        <p id="nav-dist" class="font-extrabold text-lg leading-tight"></p>
        <p id="nav-text" class="text-sm opacity-90 truncate"></p>
      </div>
      <button id="nav-voice" onclick="toggleVoice()" class="text-xl">🔊</button>
    </div>

    <!-- Directions sheet: modes, ETA, alternative routes, steps, Google Maps hand-off -->
    <div
      id="route-summary"
      class="hidden fixed bottom-0 inset-x-0 md:bottom-6 md:inset-x-auto md:left-[calc(50%+210px)] md:-translate-x-1/2 md:w-[420px] bg-white/95 backdrop-blur shadow-2xl rounded-t-3xl md:rounded-3xl p-4 pb-[max(1rem,env(safe-area-inset-bottom))] z-[900] border border-gray-200"
    >
      <div class="flex items-start justify-between gap-2">
        <p id="route-title" class="font-bold text-gray-900 truncate"></p>
        <button onclick="clearRoute()" class="text-gray-400 hover:text-gray-700 text-lg leading-none">✕</button>
      </div>
      <div class="flex gap-2 mt-2">
        <button data-mode="car" onclick="setRouteMode('car')" class="mode-btn px-3 py-1.5 rounded-full text-sm font-semibold">🚗 Drive</button>
        <button data-mode="bike" onclick="setRouteMode('bike')" class="mode-btn px-3 py-1.5 rounded-full text-sm font-semibold">🚲 Bike</button>
        <button data-mode="foot" onclick="setRouteMode('foot')" class="mode-btn px-3 py-1.5 rounded-full text-sm font-semibold">🚶 Walk</button>
      </div>
      <div class="mt-3 flex items-baseline gap-2">
        <span id="route-time" class="text-2xl font-extrabold text-emerald-700"></span>
        <span id="route-meta" class="text-sm text-gray-600"></span>
      </div>
      <div id="route-alts" class="flex gap-2 mt-2 overflow-x-auto hide-scrollbar"></div>
      <div class="flex gap-2 mt-3">
        <button id="route-start" onclick="toggleNav()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2.5 rounded-xl">Start</button>
        <a id="route-gmaps" target="_blank" rel="noopener" class="flex-1 text-center border border-emerald-600 text-emerald-700 text-sm font-semibold py-2.5 rounded-xl">Google Maps</a>
        <button onclick="document.getElementById('route-steps').classList.toggle('hidden')" class="px-3 border border-gray-300 rounded-xl text-sm font-semibold text-gray-700">Steps</button>
      </div>
      <ol id="route-steps" class="hidden mt-3 max-h-48 overflow-y-auto divide-y divide-gray-100 text-sm"></ol>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast"
      class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-gray-900/90 backdrop-blur-md text-white px-6 py-3.5 rounded-2xl shadow-2xl transition-all duration-500 -translate-y-[150%] opacity-0 z-[100] flex items-center gap-3 border border-gray-700"
    >
      <!-- Icons ... -->
      <svg
        id="toast-icon-error"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-rose-400 hidden"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <svg
        id="toast-icon-success"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-emerald-400 hidden"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <svg
        id="toast-icon-info"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-blue-400 hidden"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <span id="toast-message" class="font-medium text-sm tracking-wide"></span>
    </div>

    <!-- Loading Overlay -->
    <div
      id="loading-overlay"
      class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden z-[70] flex-col items-center justify-center"
    >
      <div
        class="bg-white/90 rounded-3xl p-8 flex flex-col items-center shadow-2xl"
      >
        <div
          class="animate-spin rounded-full h-14 w-14 border-4 border-gray-200 border-t-emerald-600 mb-4"
        ></div>
        <p class="text-gray-800 font-bold tracking-tight">
          Calculating optimal route...
        </p>
      </div>
    </div>

    <!-- Scripts -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

          if (!btn.dataset.label) btn.dataset.label = btn.innerText.trim();
          const n = cat === "All" ? places.length : places.filter((p) => p.cat === cat).length;
          btn.innerHTML = `${btn.dataset.label} <span class="opacity-70 text-xs">${n}</span>`;
          const active = cat === currentFilter;
          btn.classList.remove(...on, ...off);
          btn.classList.add(...(active ? on : off));
        });
      }

      function filterPlaces(category) {

        renderMarkersAndSidebar();

        if (markers.length > 0 && !routingControl) {
          const group = new L.featureGroup(markers);
          // Offset map bounds to account for sidebar on desktop
          const paddingLeft = window.innerWidth > 768 ? 450 : 50;

      function focusPlace(place) {
        showMap(); // Slide list away on mobile

        // Offset view for sidebar on desktop only
        const paddingLeft = window.innerWidth > 768 ? 400 : 0;

        const targetPoint = map
          .project([place.lat, place.lng], 15)
          .subtract([paddingLeft / 2, 0]);
        const targetLatLng = map.unproject(targetPoint, 15);

        map.flyTo(targetLatLng, 15, { duration: 1.5 });

        setTimeout(() => {
          place.marker.openPopup();
        }, 1000);

      function getDirectionsTo(destLat, destLng, destName) {
        showMap(); // Slide list away on mobile

        document.getElementById("loading-overlay").classList.remove("hidden");
        document.getElementById("loading-overlay").classList.add("flex");

        if (!navigator.geolocation) {
          document.getElementById("loading-overlay").classList.add("hidden");
          document.getElementById("loading-overlay").classList.remove("flex");
          showToast("Geolocation is not supported by your browser.", "error");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            drawRoute(
              position.coords.latitude,
              position.coords.longitude,
              destLat,
              destLng,
              destName,
            );
          },
          (error) => {
            document.getElementById("loading-overlay").classList.add("hidden");
            document.getElementById("loading-overlay").classList.remove("flex");
            let errorMsg = "Unable to retrieve your location.";
            if (error.code === 1) errorMsg = "Location access denied.";

            showToast(
              errorMsg + " Simulating location from Siem Reap Airport.",
              "info",
            );
            setTimeout(
              () => drawRoute(13.4109, 103.813, destLat, destLng, destName),
              2000,
            );
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
        );
      }

      // --- Google-Maps-style directions (free OpenStreetMap routing servers, no API key) ---
      const ROUTE_MODES = {
        car: ["https://routing.openstreetmap.de/routed-car/route/v1", "https://router.project-osrm.org/route/v1"],
        bike: ["https://routing.openstreetmap.de/routed-bike/route/v1"],
        foot: ["https://routing.openstreetmap.de/routed-foot/route/v1"],
      };
      let routeMode = "car";
      let lastStart = null;
      let lastDest = null;
      let navWatch = null;
      let accuracyCircle = null;
      let speakOn = true;
      let lastReroute = 0;
      let spokenIdx = -1;

      function fmtDist(m) {
        return m < 1000 ? `${Math.max(10, Math.round(m / 10) * 10)} m` : `${(m / 1000).toFixed(1)} km`;
      }
      function fmtTime(sec) {
        const m = Math.max(1, Math.round(sec / 60));
        return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
      }
      function stepArrow(ins) {
        const k = ((ins.type || "") + (ins.modifier || "")).toLowerCase().replace(/[\s_-]/g, "");
        if (/destination|arrive/.test(k)) return "🏁";
        if (/uturn|turnaround/.test(k)) return "↶";
        if (/roundabout|rotary/.test(k)) return "⟳";
        if (/sharpleft/.test(k)) return "↰";
        if (/slightleft/.test(k)) return "↖";
        if (/left/.test(k)) return "↰";
        if (/sharpright|right/.test(k) && !/slightright/.test(k)) return "↱";
        if (/slightright/.test(k)) return "↗";
        return "↑";
      }
      function stepText(ins) {
        return ins.text || [ins.type, ins.modifier, ins.road ? "onto " + ins.road : ""].filter(Boolean).join(" ");
      }
      function speak(text) {
        if (!speakOn || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }
      function toggleVoice() {
        speakOn = !speakOn;
        document.getElementById("nav-voice").innerText = speakOn ? "🔊" : "🔇";
        if (!speakOn && "speechSynthesis" in window) speechSynthesis.cancel();
      }

      function drawRoute(startLat, startLng, destLat, destLng, destName) {
        document.getElementById("loading-overlay").classList.add("hidden");
        document.getElementById("loading-overlay").classList.remove("flex");
        clearRoute();

        lastStart = { lat: startLat, lng: startLng };
        lastDest = { lat: destLat, lng: destLng, name: destName };

        userMarker = L.marker([startLat, startLng], {
          icon: icons["User"],
          zIndexOffset: 1000,
        })
          .addTo(map)
          .bindPopup("<b class='font-sans'>Your Location</b>", {
            className: "glass-popup",
          })
          .openPopup();

        // routingControl now holds our own route state (kept so other code can test "is a route active")
        routingControl = { routes: [], pairs: [], layers: [], sel: 0, token: 0 };

        document.getElementById("route-title").innerText = destName;
        document.getElementById("route-gmaps").href =
          `https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=${routeMode === "car" ? "driving" : routeMode === "bike" ? "bicycling" : "walking"}`;
        document.getElementById("route-summary").classList.remove("hidden");
        document.getElementById("clear-route-btn").classList.remove("hidden");
        updateModeButtons();
        requestRoutes();
      }

      function updateModeButtons() {
        document.querySelectorAll(".mode-btn").forEach((b) => {
          const on = b.dataset.mode === routeMode;
          b.classList.toggle("bg-emerald-600", on);
          b.classList.toggle("text-white", on);
          b.classList.toggle("bg-gray-100", !on);
          b.classList.toggle("text-gray-700", !on);
        });
      }

      function setRouteMode(m) {
        routeMode = m;
        updateModeButtons();
        if (lastDest) {
          document.getElementById("route-gmaps").href =
            `https://www.google.com/maps/dir/?api=1&destination=${lastDest.lat},${lastDest.lng}&travelmode=${m === "car" ? "driving" : m === "bike" ? "bicycling" : "walking"}`;
        }
        if (routingControl) requestRoutes();
      }

      function requestRoutes() {
        const st = routingControl;
        if (!st) return;
        st.layers.forEach((l) => map.removeLayer(l));
        st.layers = [];
        st.pairs = [];
        st.routes = [];
        document.getElementById("route-time").innerText = "Finding routes…";
        document.getElementById("route-meta").innerText = "";
        document.getElementById("route-alts").innerHTML = "";
        document.getElementById("route-steps").innerHTML = "";

        const wps = [
          L.Routing.waypoint(L.latLng(lastStart.lat, lastStart.lng)),
          L.Routing.waypoint(L.latLng(lastDest.lat, lastDest.lng)),
        ];
        // Turned off to speed up calculations on the free server (showAlternatives is now on: the OSM servers handle it, and users can compare routes)
        const servers = ROUTE_MODES[routeMode].slice();
        const token = (st.token = Date.now());

        const tryNext = () => {
          if (st.token !== token || routingControl !== st) return;
          if (!servers.length) return routeFailed();
          // Explicitly use the free OSRM public routing server (No API Key Required)
          // (walk/bike/car profiles come from the free routing.openstreetmap.de servers, OSRM is the car fallback)
          L.Routing.osrmv1({ serviceUrl: servers.shift() }).route(wps, (err, routes) => {
            if (st.token !== token || routingControl !== st) return;
            if (err || !routes || !routes.length) return tryNext();
            st.routes = routes;
            routes.forEach((r, i) => {
              const casing = L.polyline(r.coordinates, { color: "#ffffff", weight: 10, opacity: 0.9 }).addTo(map);
              const line = L.polyline(r.coordinates, { weight: 6 }).addTo(map);
              casing.on("click", () => selectRoute(i));
              line.on("click", () => selectRoute(i));
              st.pairs.push({ casing, line });
              st.layers.push(casing, line);
            });
            selectRoute(0, navWatch === null);
          });
        };
        tryNext();
      }

      function routeFailed() {
        // Fallback if the free public server is rate-limited
        showToast("Public routing server is busy. Drawing direct path.", "info");
        const fallbackLine = L.polyline(
          [[lastStart.lat, lastStart.lng], [lastDest.lat, lastDest.lng]],
          { color: "#059669", opacity: 0.7, weight: 5, dashArray: "10, 10" },
        ).addTo(map);
        routingControl._fallbackLine = fallbackLine;
        map.fitBounds(fallbackLine.getBounds(), { padding: [50, 50] });
        const km = map.distance([lastStart.lat, lastStart.lng], [lastDest.lat, lastDest.lng]) / 1000;
        document.getElementById("route-time").innerText = `${km.toFixed(1)} km`;
        document.getElementById("route-meta").innerText = "straight-line distance";
      }

      function selectRoute(i, fit) {
        const st = routingControl;
        if (!st || !st.routes[i]) return;
        st.sel = i;
        st.pairs.forEach((p, j) => {
          p.line.setStyle(j === i ? { color: "#059669", opacity: 0.95, weight: 6 } : { color: "#94a3b8", opacity: 0.85, weight: 5 });
          p.casing.setStyle({ weight: j === i ? 10 : 8 });
        });
        st.pairs.forEach((p, j) => { if (j !== i) { p.casing.bringToFront(); p.line.bringToFront(); } });
        st.pairs[i].casing.bringToFront();
        st.pairs[i].line.bringToFront();

        const r = st.routes[i];
        const sum = r.summary;
        const arrive = new Date(Date.now() + sum.totalTime * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.getElementById("route-time").innerText = fmtTime(sum.totalTime);
        document.getElementById("route-meta").innerText = `${fmtDist(sum.totalDistance)} · arrive ${arrive}`;

        // Alternative route chips
        const fastest = Math.min(...st.routes.map((x) => x.summary.totalTime));
        document.getElementById("route-alts").innerHTML = st.routes.length < 2 ? "" : st.routes
          .map((x, k) => `<button onclick="selectRoute(${k}, true)" class="shrink-0 px-3 py-1 rounded-lg text-xs font-semibold border ${k === i ? "bg-emerald-50 border-emerald-500 text-emerald-700" : "border-gray-300 text-gray-600"}">${x.summary.totalTime === fastest ? "Fastest" : "Route " + (k + 1)} · ${fmtTime(x.summary.totalTime)} · ${fmtDist(x.summary.totalDistance)}</button>`)
          .join("");

        // Step list (tap a step to jump to it on the map)
        document.getElementById("route-steps").innerHTML = r.instructions
          .map((ins, k) => `<li onclick="focusStep(${k})" class="py-2 flex items-center gap-3 cursor-pointer"><span class="text-xl w-7 text-center">${stepArrow(ins)}</span><span class="flex-1 text-gray-800">${stepText(ins)}</span><span class="text-xs text-gray-500">${fmtDist(ins.distance)}</span></li>`)
          .join("");

        if (fit) {
          const left = window.innerWidth > 768 ? 450 : 40;
          map.fitBounds(L.polyline(r.coordinates).getBounds(), {
            paddingTopLeft: [left, 60],
            paddingBottomRight: [40, window.innerWidth > 768 ? 200 : 320],
          });
        }
      }

      function focusStep(k) {
        const st = routingControl;
        if (!st) return;
        const r = st.routes[st.sel];
        map.flyTo(r.coordinates[r.instructions[k].index], 17, { duration: 1 });
      }

      // --- Live navigation: GPS follow, next-turn banner, voice, auto-reroute ---
      function toggleNav() {
        navWatch === null ? startNav() : stopNav();
      }

      function startNav() {
        if (!navigator.geolocation) return showToast("Geolocation is not supported by your browser.", "error");
        spokenIdx = -1;
        navWatch = navigator.geolocation.watchPosition(onNavPosition, () => showToast("Lost GPS signal.", "error"), {
          enableHighAccuracy: true,
          maximumAge: 2000,
        });
        document.getElementById("route-start").innerText = "End";
        document.getElementById("nav-banner").classList.remove("hidden");
        document.getElementById("route-steps").classList.add("hidden");
      }

      function stopNav() {
        if (navWatch !== null) {
          navigator.geolocation.clearWatch(navWatch);
          navWatch = null;
        }
        if (accuracyCircle) {
          map.removeLayer(accuracyCircle);
          accuracyCircle = null;
        }
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        document.getElementById("nav-banner").classList.add("hidden");
        document.getElementById("route-start").innerText = "Start";
      }

      function onNavPosition(pos) {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
        const here = L.latLng(lat, lng);
        lastStart = { lat, lng };
        if (userMarker) userMarker.setLatLng(here);
        if (accuracyCircle) accuracyCircle.setLatLng(here).setRadius(accuracy);
        else accuracyCircle = L.circle(here, { radius: accuracy, color: "#2563eb", weight: 1, fillOpacity: 0.1 }).addTo(map);

        const st = routingControl;
        if (!st || !st.routes.length) return;
        const r = st.routes[st.sel];

        if (map.distance(here, [lastDest.lat, lastDest.lng]) < 30) {
          showToast("You have arrived at " + lastDest.name, "success");
          speak("You have arrived");
          stopNav();
          return;
        }

        // Nearest point on the route = progress; far from it = off route
        let best = 0, bestD = Infinity;
        r.coordinates.forEach((c, k) => {
          const d = map.distance(here, c);
          if (d < bestD) { bestD = d; best = k; }
        });
        if (bestD > 80 && Date.now() - lastReroute > 15000) {
          lastReroute = Date.now();
          showToast("Off route — rerouting…", "info");
          requestRoutes();
          return;
        }

        const ins = r.instructions.find((x) => x.index > best) || r.instructions[r.instructions.length - 1];
        const d = map.distance(here, r.coordinates[ins.index]);
        document.getElementById("nav-arrow").innerText = stepArrow(ins);
        document.getElementById("nav-dist").innerText = fmtDist(d);
        document.getElementById("nav-text").innerText = stepText(ins);
        if (d < 150 && spokenIdx !== ins.index) {
          spokenIdx = ins.index;
          speak(`In ${fmtDist(d)}, ${stepText(ins)}`);
        }
        map.setView(here, Math.max(map.getZoom(), 16), { animate: true });
      }

      function clearRoute() {
        stopNav();
        if (routingControl) {
          if (routingControl._fallbackLine) {
            map.removeLayer(routingControl._fallbackLine);
          }
          (routingControl.layers || []).forEach((l) => map.removeLayer(l));
          routingControl = null;
        }
        if (userMarker) {
          map.removeLayer(userMarker);
          userMarker = null;
        }
        document.getElementById("clear-route-btn").classList.add("hidden");
        document.getElementById("route-summary").classList.add("hidden");

        if (markers.length > 0) {
          const group = new L.featureGroup(markers);
          const paddingLeft = window.innerWidth > 768 ? 450 : 50;
          map.fitBounds(group.getBounds(), {
            paddingBottomRight: [50, 50],
            paddingTopLeft: [paddingLeft, 50],
          });
        }
      }

      // --- Short Google Maps links (maps.app.goo.gl) ---
      const SHORT_LINK = /https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|share\.google)\/\S+/i;
      let resolveToken = 0;
      let resolveTimer = null;

      // Strict patterns only: safe to run on a whole HTML page
      function strictParse(text) {
        const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&]center=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/];
        for (const re of pats) {
          const m = (text || "").match(re);
          if (m) {
            const r = fix(parseFloat(m[1]), parseFloat(m[2]));
            if (r) return r;
          }
        }
        return null;
      }

      function nameFromUrl(u) {
        const m = (u || "").match(/\/maps\/place\/([^/@?]+)/);
        if (!m) return "";
        try { return decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) { return ""; }
      }

      // Browsers cannot follow Google's redirect themselves (CORS), so go through free public proxies
      async function resolveShortLink(url) {
        const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
        const attempts = [
          async () => {
            const j = await (await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(url))).json();
            return [j.status && j.status.url, j.contents];
          },
          async () => {
            const r = await fetch("https://corsproxy.io/?url=" + encodeURIComponent(url));
            return [r.url, await r.text()];
          },
          async () => {
            const r = await fetch("https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(url));
            return [r.url, await r.text()];
          },
        ];
        for (const attempt of attempts) {
          try {
            const [finalUrl, body] = await timeout(attempt(), 9000);
            const fromUrl = finalUrl && /google\./.test(finalUrl) ? finalUrl : "";
            const pos = strictParse(decodeURIComponent((fromUrl || "").replace(/%(?![0-9a-f]{2})/gi, "%25"))) || strictParse(body);
            if (pos) {
              const t = ((body || "").match(/<title>([^<]+)<\/title>/i) || [])[1] || "";
              const title = /^\s*(google )?maps\s*$/i.test(t) ? "" : t.replace(/\s*-\s*Google Maps\s*$/i, "").trim();
              return { ...pos, name: nameFromUrl(fromUrl) || title };
            }
          } catch (e) {}
        }
        return null;
      }

      function setPmStatus(text, ok) {
        const el = document.getElementById("pm-status");
        el.innerText = text;
        el.className = "text-xs mt-1.5 font-medium " + (text ? (ok === true ? "text-emerald-700" : ok === false ? "text-rose-600" : "text-gray-500") : "hidden");
      }

      // Resolve a pasted short link and fill in the location (and the name if empty)
      async function resolveIntoForm(raw) {
        const token = ++resolveToken;
        setPmStatus("Reading link…", null);
        const r = await resolveShortLink(raw.match(SHORT_LINK)[0]);
        if (token !== resolveToken) return false;
        if (!r) {
          setPmStatus("Couldn't open this short link automatically. Open it, copy the full address from the browser bar (or long-press the spot for coordinates) and paste that here.", false);
          return false;
        }
        document.getElementById("pm-coords").value = `${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}`;
        const nameEl = document.getElementById("pm-name");
        if (!nameEl.value.trim() && r.name) nameEl.value = r.name;
        setPmStatus(`Location found${r.name ? ": " + r.name : ""} ✓`, true);
        return true;
      }

      function onCoordsInput(v) {
        clearTimeout(resolveTimer);
        if (!SHORT_LINK.test(v)) return setPmStatus("", null);
        resolveTimer = setTimeout(() => resolveIntoForm(v), 400);
      }

      // --- Add your own places ---
      let editingId = null;

      // Escape user text (it is rendered inside HTML templates and inline onclick strings)
      function esc(t) {
        return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "’").replace(/\\/g, "/");
      }
      function unesc(t) {
        return t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
      }

      // Accepts "13.41, 103.86" or a Google Maps link containing coordinates
      // Also understands degrees-minutes-seconds (13°21'17"N 103°51'22"E), N/S/E/W suffixes, and lng,lat order
      function parseLatLng(text) {
        text = decodeURIComponent((text || "").replace(/%(?![0-9a-f]{2})/gi, "%25"));
        const sign = (v, h) => (/[SW]/i.test(h) ? -v : v);
        let m = text.match(/(\d+)\s*°\s*(\d+)\s*['′]\s*(\d+(?:\.\d+)?)\s*["″]?\s*([NS])[\s,;]*(\d+)\s*°\s*(\d+)\s*['′]\s*(\d+(?:\.\d+)?)\s*["″]?\s*([EW])/i);
        if (m) return fix(sign(+m[1] + m[2] / 60 + m[3] / 3600, m[4]), sign(+m[5] + m[6] / 60 + m[7] / 3600, m[8]));
        m = text.match(/(\d+\.\d+)\s*°?\s*([NS])[\s,;]*(\d+\.\d+)\s*°?\s*([EW])/i);
        if (m) return fix(sign(+m[1], m[2]), sign(+m[3], m[4]));
        // !3d!4d is the real pin; "@" is only the map view centre (can be far off at low zoom), so it comes second
        const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&](?:q|ll|query|destination|center)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/, /(-?\d+\.\d+)\s*[,;\s]\s*(-?\d+\.\d+)/];
        for (const re of pats) {
          m = text.match(re);
          if (m) {
            const r = fix(parseFloat(m[1]), parseFloat(m[2]));
            if (r) return r;
          }
        }
        return null;
      }
      // Validate; swap if the pair was pasted as "lng, lat"
      function fix(lat, lng) {
        if (Math.abs(lat) > 90 && Math.abs(lng) <= 90) [lat, lng] = [lng, lat];
        return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null;
      }

      function saveCustomPlaces() {
        try {
          localStorage.setItem(
            "sr-custom-places",
            JSON.stringify(places.filter((p) => p.custom).map(({ marker, ...rest }) => rest)),
          );
        } catch (e) {
          showToast("Could not save on this device (storage blocked).", "error");
        }
      }

      function openAddPlace(id) {
        const place = id ? places.find((p) => p.id === id) : null;
        editingId = place ? place.id : editingId;
        document.getElementById("place-modal-title").innerText = editingId ? "Edit place" : "Add a place";
        if (place) {
          document.getElementById("pm-name").value = unesc(place.name);
          document.getElementById("pm-cat").value = place.cat;
          document.getElementById("pm-desc").value = unesc(place.desc);
          document.getElementById("pm-coords").value = `${place.lat}, ${place.lng}`;
        }
        const m = document.getElementById("place-modal");
        m.classList.remove("hidden");
        m.classList.add("flex");
      }

      function closePlaceModal(reset = true) {
        const m = document.getElementById("place-modal");
        m.classList.add("hidden");
        m.classList.remove("flex");
        if (reset) {
          ["pm-name", "pm-desc", "pm-coords"].forEach((i) => (document.getElementById(i).value = ""));
          setPmStatus("", null);
          editingId = null;
        }
      }

      function startPickLocation() {
        closePlaceModal(false); // keep typed text while choosing on the map
        showMap();
        document.getElementById("pick-banner").classList.remove("hidden");
        map.getContainer().style.cursor = "crosshair";
        map.once("click", (e) => {
          document.getElementById("pm-coords").value = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
          finishPick();
        });
      }

      function finishPick() {
        map.getContainer().style.cursor = "";
        document.getElementById("pick-banner").classList.add("hidden");
        openAddPlace();
      }

      function cancelPick() {
        map.off("click");
        finishPick();
      }

      function useMyLocation() {
        if (!navigator.geolocation) return showToast("Geolocation is not supported by your browser.", "error");
        navigator.geolocation.getCurrentPosition(
          (pos) => (document.getElementById("pm-coords").value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`),
          () => showToast("Could not get your location.", "error"),
          { enableHighAccuracy: true, timeout: 10000 },
        );
      }

      async function savePlace() {
        let name = document.getElementById("pm-name").value.trim();
        let pos = parseLatLng(document.getElementById("pm-coords").value);
        const rawInput = document.getElementById("pm-coords").value.trim();
        if (!pos && SHORT_LINK.test(rawInput)) {
          // Link pasted but not resolved yet (or failed earlier): try now
          if (await resolveIntoForm(rawInput)) {
            pos = parseLatLng(document.getElementById("pm-coords").value);
            name = document.getElementById("pm-name").value.trim();
          }
        }
        if (!name) return showToast("Please enter a name.", "error");
        if (!pos) {
          const raw = document.getElementById("pm-coords").value.trim();
          if (!raw) return showToast("Location is empty. Tap “Pick on map” or “My location”, or paste coordinates.", "error");
          if (/goo\.gl|maps\.app|share\.google/i.test(raw))
            return showToast("Short Google links can't be read. Open it, copy the full link from the address bar, or long-press the spot in Google Maps and paste the coordinates.", "error");
          return showToast("Couldn't find coordinates in that text. Try 13.41250, 103.86700 or use “Pick on map”.", "error");
        }
        const data = {
          name: esc(name),
          cat: document.getElementById("pm-cat").value,
          desc: esc(document.getElementById("pm-desc").value.trim() || "Added by me."),
          lat: pos.lat,
          lng: pos.lng,
        };
        let place = editingId ? places.find((p) => p.id === editingId) : null;
        if (place) Object.assign(place, data);
        else {
          place = { id: Date.now(), custom: true, ...data };
          places.push(place);
        }
        saveCustomPlaces();
        closePlaceModal();
        // Show everything so the new place is visible, then jump to it
        currentFilter = "All";
        currentSearch = "";
        document.getElementById("search-input").value = "";
        renderMarkersAndSidebar();
        updateFilterButtons();
        showToast("Place saved.", "success");
        focusPlace(place);
      }

      function deletePlace(id) {
        const i = places.findIndex((p) => p.id === id);
        if (i < 0 || !confirm(`Delete "${unesc(places[i].name)}"?`)) return;
        places.splice(i, 1);
        visited.delete(id);
        saveCustomPlaces();
        renderMarkersAndSidebar();
        updateFilterButtons();
      }

      window.onload = initMap;
    </script>

    <script>
      // 1. Generate PWA Manifest Dynamically
      const manifestData = {
        name: "Siem Reap Travel Planner",
        short_name: "SiemReapApp",
        description:
          "Your ultimate 2-day 1-night travel planner for Siem Reap.",
        start_url: window.location.href.split("?")[0],
        display: "standalone",
        background_color: "#f8fafc",
        theme_color: "#059669",
        icons: [
          {
            src: "https://placehold.co/192x192/059669/ffffff.png?text=SR",
            sizes: "192x192",
            type: "image/png",
          },
          {
            src: "https://placehold.co/512x512/059669/ffffff.png?text=SR",
            sizes: "512x512",
            type: "image/png",
          },
        ],
      };
      // Inject manifest into the link tag we added in the head
      // Real manifest.json when served over http(s); data URL only as a local fallback
      document.getElementById("manifest").href = location.protocol.startsWith("http")
        ? "manifest.json"
        : "data:application/manifest+json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(manifestData));

      // 2. Register Service Worker Dynamically for Offline/PWA support
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // Define a basic network-first Service Worker
          // (Service worker now lives in sw.js: browsers reject blob: URLs and it needs to cache offline assets)
          // Create a blob URL for the service worker
          const swUrl = "./sw.js";

          navigator.serviceWorker
            .register(swUrl)
            .then((reg) =>
              console.log("PWA Service Worker registered successfully."),
            )
            .catch((err) =>
              console.info(
                "PWA Service Worker skipped (expected if running in sandboxed iframe environment).",
              ),
            );
        });
      }
    </script>
  </body>
</html>
